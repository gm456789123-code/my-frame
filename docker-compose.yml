services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # WordPress's own schema (e.g. wp_posts.post_date defaulting to
    # '0000-00-00 00:00:00') is incompatible with MySQL 8's default strict
    # sql_mode (NO_ZERO_DATE/STRICT_TRANS_TABLES), which breaks ALTER TABLE
    # on wp_posts even when the migration doesn't touch post_date at all.
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress.Dockerfile
    entrypoint: ["docker-php-entrypoint", "php-fpm"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: wordpress
      DB_USERNAME: wordpress
      DB_PASSWORD: wordpress
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_URL: http://localhost:8080
      APP_ENV: local
    volumes:
      - wp_data:/var/www/html
      - ./themes/sovereign:/var/www/html/wp-content/themes/sovereign
      - ./assets:/var/www/html/assets:ro
      - ./:/var/www/app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html:ro
      - ./themes/sovereign:/var/www/html/wp-content/themes/sovereign:ro
      - ./assets:/var/www/html/assets:ro
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /var/www/app
    volumes:
      - ./:/var/www/app
      # Same WordPress core volume the wordpress/nginx services serve from
      # -- without this, SmartBootstrapper (invoked via bin/console
      # wp:install from this container) writes WP core into an isolated,
      # throwaway /var/www/html that nothing else can ever see.
      - wp_data:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: wordpress
      DB_USERNAME: wordpress
      DB_PASSWORD: wordpress
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sleep", "infinity"]

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./themes/sovereign:/var/www/html/wp-content/themes/sovereign
    entrypoint: ["wp"]
    profiles: ["tools"]

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: ["composer"]
    profiles: ["tools"]

volumes:
  mysql_data:
  wp_data:
