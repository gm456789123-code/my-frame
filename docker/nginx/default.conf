server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # ---- The lines that need editing for a non-Docker deployment ----
    # Where WordPress core actually lives (wp-admin/, wp-includes/, etc.).
    set $wp_root /var/www/html;
    # Where this project was cloned to (contains public/, vendor/, templates/).
    set $app_public /var/www/app/public;
    # PHP-FPM backend. This must be a literal value, not a variable: nginx
    # only resolves variable-based fastcgi_pass targets through a
    # `resolver` directive (meant for dynamic upstream discovery), which is
    # more fragile than it's worth for a value that never actually changes.
    # Replace wordpress:9000 below (all 3 occurrences) with your own, e.g.
    # 127.0.0.1:9000 or unix:/run/php/php8.3-fpm.sock.
    # -------------------------------------------------------------------

    # Permanently block the installer: once provisioned, a stray or
    # resurfaced install.php is the single highest-value target an attacker
    # could reach (a DB desync would let it reopen "create the first admin
    # account"). Exact match takes priority over the /wp-admin/ prefix below
    # regardless of order, so this is safe wherever it's placed.
    location = /wp-admin/install.php {
        deny all;
        return 404;
    }

    # WordPress keeps handling admin, login, and cron exactly as it always
    # has -- nothing here is bypassed or rewritten.
    location ^~ /wp-admin/ {
        root $wp_root;
        index index.php;
        try_files $uri $uri/ /wp-admin/index.php?$args;

        location ~ \.php$ {
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location ~ ^/(wp-login\.php|wp-cron\.php|xmlrpc\.php)$ {
        root $wp_root;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never execute PHP placed under uploads -- the #1 WordPress RCE
    # escalation path is a plugin upload flaw dropping a .php "shell" there;
    # this closes the execution step even if some other flaw allows the write.
    # Must be its own ^~ prefix location, longer/more specific than the
    # /wp-content/ block below, so nginx picks this one first and the
    # nested regex actually gets evaluated (a plain regex location here
    # would never run: /wp-content/'s ^~ prefix match would shadow it).
    location ^~ /wp-content/uploads/ {
        root $wp_root;

        location ~* \.(php[0-9]?|phtml|pht|phar)$ {
            deny all;
            return 404;
        }
    }

    # Static assets wp-admin itself needs (admin CSS/JS, uploads).
    location ^~ /wp-content/ {
        root $wp_root;
    }

    location ^~ /wp-includes/ {
        root $wp_root;
    }

    # Everything else is a public page view: served directly by our own
    # front controller, which never loads WordPress at all (no wp-load.php,
    # no WP_Query) -- see public/front.php.
    location / {
        root $app_public;
        try_files $uri /front.php?$args;
    }

    location ~ \.php$ {
        root $app_public;
        fastcgi_pass wordpress:9000;
        fastcgi_index front.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
